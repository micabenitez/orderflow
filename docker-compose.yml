services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres
    restart: always
    environment:
      POSTGRES_DB: orderflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    networks:
      - orderflow-network

volumes:
  postgres_data:
    driver: local

networks:
  orderflow-network:
    driver: bridge