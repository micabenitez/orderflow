spring:
  application:
    name: orderflow
  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow ${DB_URL}
    username: postgres ${DB_USERNAME}
    password: 1234 ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true